<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="favicon.png" type="image/png">

    <link rel="stylesheet" href="style.css">

<body>
    <main>

        <h1>{{ name }} <button id="theme-toggle" class="theme-toggle" type="button"></button></h1>

                <summary id="tarot-result">⟢ pull a tarot card for today</summary>

            </details>
        </div>

        <h2>journal log</h2>
        <div class="accordion" id="journal"></div>


        <h2>greetings</h2>
        <div class="accordion">
            <details>
                <summary><p class="muted">2026</p>monica huynh</summary>

            </details>
        </div>


        <footer>
            <div class="links">

                <a href="https://cabinofmonica.substack.com" target="_blank">substack</a>
                <a href="https://instagram.com/monicadotzip" target="_blank">instagram</a>
                <a href="https://www.linkedin.com/in/monicachauhuynh" target="_blank">linkedin</a>
                <a href="mailto:monicachauhuynh@gmail.com" target="_blank">email</a>
            </div>
            <div>{{ footer }}</div>
        </footer>
    </main>
    <script src="constant.js"></script>
    <script src="data.js"></script>
    <script src="theme.js"></script>
</body>

</html>
