<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/assets/favicon.ico">
    <title>monica · châu · huỳnh</title>
    <meta name="description" content="by monica huynh">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">

</head>

<body>
    <main>

        <!-- <button id="theme-toggle" class="theme-toggle" type="button"></button> -->

        <div class="muted">ツ click/tap to expand</div>

        <h2></h2>
        <div class="accordion">
            <details>
                <summary>
                    <p class="muted">life receipt for</p>
                    <p>{{ name }}</p>
                </summary>
                <p>{{ greetings }}</p>
            </details>
            <details>
                <summary>
                    <p class="muted">timezone</p>
                    <p id="saigon">checking mercury</p>
                </summary>
                <p>{{ city }}</p>
            </details>
            <details>
                <summary>
                    <p class="muted">mercury retrograde</p>
                    <p id="mercury-status">checking mercury</p>
                </summary>
                <p>{{ mercury }}</p>
            </details>
            <details>
                <summary>
                    <p class="muted" id="spotify-label">
                        listening to
                    </p>

                    <p id="spotify-status">
                        checking spotify...
                    </p>
                </summary>
                <p></p>
            </details>
        </div>

        <h2>journal log</h2>
        <div class="accordion" id="journal"></div>

        <h2>elsewhere</h2>
        <div class="links">
            <a href="https://are.na/monica-huynh" target="_blank">are.na</a>
            <a href="https://cabinofmonica.substack.com" target="_blank">substack</a>
            <a href="https://instagram.com/monicadotzip" target="_blank">instagram</a>
            <a href="https://www.linkedin.com/in/monicachauhuynh" target="_blank">linkedin</a>
            <a href="mailto:monicachauhuynh@gmail.com" target="_blank">email</a>
        </div>

        <div class="container">
            <img src="/assets/barcode-light.png" alt="Image">
        </div>
    </main>
    <script src="constant.js"></script>
    <script src="data.js"></script>
    <script src="theme.js"></script>
</body>

</html>
